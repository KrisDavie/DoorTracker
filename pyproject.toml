[project]
name = "doortracker"
version = "0.1.0"
description = "Auto-tracker for dungeon layouts in the ALttP door randomizer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "grpcio",
    "protobuf",
    "pillow",
    "pyside6",
    "pyyaml",
]

[tool.uv]
# Not packaged: top-level gui/, data/ and sni/ would install under those names
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ty>=0.0.104",
]

[tool.ruff]
# Generated by protoc
extend-exclude = ["sni/sni_pb2*"]

[tool.ty.src]
# Not sni/: generated by protoc
include = ["DoorsTracker.py", "sni_tracker.py", "data", "gui", "tools", "tests"]

[tool.ty.environment]
# Tests import support.py by its bare name
extra-paths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
